name: mashup

# Mashup stems in the cloud (Demucs on CPU) so toki's PC stays free (raymi/mashup.py).
# Start: push jobs/<job>/mashup.json on any branch, or Actions -> mashup -> Run workflow -> job.
# Result: jobs/<job>/measure.json (tempo, bars, key, stem loudness per bar) committed back to the same branch;
# the stems (drums / bass / other / vocals per source) as the artifact "stems-<job>"
# (`gh run download <id> -n stems-<job> -D jobs/<job>/out/stems`).

on:
  workflow_dispatch:
    inputs:
      job:
        description: "job folder under jobs/"
        required: true
  push:
    paths: ["jobs/*/mashup.json"]

permissions:
  contents: write

concurrency:
  group: mashup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-analyze.txt
          pip install -q --no-deps demucs==4.0.1
      - name: Models (cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: models-htdemucs-v1
      - name: Which jobs
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOBS="${{ github.event.inputs.job }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE=$(git rev-parse -q --verify HEAD~1 || git hash-object -t tree /dev/null)
            fi
            JOBS=$(git diff --name-only "$BEFORE" HEAD -- 'jobs/*/mashup.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
          echo "first=$(echo $JOBS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Measure
        if: steps.which.outputs.jobs != ''
        run: |
          set -e
          for J in ${{ steps.which.outputs.jobs }}; do
            START=$(date +%s)
            python -m raymi mashup "$J" --measure | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$J: $(( $(date +%s) - START )) s" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Stems artifact
        if: steps.which.outputs.jobs != ''
        uses: actions/upload-artifact@v4
        with:
          name: stems-${{ steps.which.outputs.first }}
          path: jobs/${{ steps.which.outputs.first }}/out/stems
          retention-days: 30
      - name: Commit results
        if: steps.which.outputs.jobs != ''
        run: |
          git config user.name "raymi-mashup-bot"
          git config user.email "actions@users.noreply.github.com"
          for J in ${{ steps.which.outputs.jobs }}; do git add "jobs/$J/measure.json"; done
          git diff --cached --quiet || (git commit -qm "mashup measure for ${{ steps.which.outputs.jobs }} [skip ci]" && git pull --rebase -q origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}")
