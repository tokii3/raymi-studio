name: vrm-clip

# Short VRM animation studies are rendered on GitHub Actions; never render on the local machine.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "job folder under jobs/"
        required: true
  push:
    branches: [main]
    paths: ["jobs/*/clip.json", "studio/clip.mjs", "studio/lib.mjs", "studio/restore-mixamo.mjs", "studio/src/VrmClip.tsx", "studio/src/film/Film.tsx", "studio/src/three/VrmPuppet.tsx", "studio/src/three/vrmFilm.ts", "studio/src/three/vrmPoses.ts", "studio/src/three/vrmLipSync.ts", "studio/src/film/Fx2D.tsx", "studio/src/film/motion.ts", "studio/src/film/Transitions.tsx", ".github/workflows/vrm-clip.yml"]

permissions:
  contents: write

concurrency:
  group: vrm-clip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # a clip job may render several variants (lip sync v1 / v2 + a camera test)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser and media tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Node modules (cached)
        id: nm
        uses: actions/cache@v4
        with:
          path: studio/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('studio/package-lock.json') }}-v1
      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: cd studio && npm ci --no-audit --no-fund
      - name: Typecheck and prepare browser
        run: cd studio && npx tsc --noEmit && npx remotion browser ensure
      - name: Restore protected Mixamo motions
        env:
          MIXAMO_BUNDLE_01: ${{ secrets.MIXAMO_BUNDLE_01 }}
          MIXAMO_BUNDLE_02: ${{ secrets.MIXAMO_BUNDLE_02 }}
          MIXAMO_BUNDLE_03: ${{ secrets.MIXAMO_BUNDLE_03 }}
          MIXAMO_BUNDLE_04: ${{ secrets.MIXAMO_BUNDLE_04 }}
          MIXAMO_BUNDLE_05: ${{ secrets.MIXAMO_BUNDLE_05 }}
          MIXAMO_BUNDLE_06: ${{ secrets.MIXAMO_BUNDLE_06 }}
          MIXAMO_BUNDLE_07: ${{ secrets.MIXAMO_BUNDLE_07 }}
          MIXAMO_BUNDLE_08: ${{ secrets.MIXAMO_BUNDLE_08 }}
          MIXAMO_BUNDLE_09: ${{ secrets.MIXAMO_BUNDLE_09 }}
          MIXAMO_BUNDLE_10: ${{ secrets.MIXAMO_BUNDLE_10 }}
          MIXAMO_BUNDLE_11: ${{ secrets.MIXAMO_BUNDLE_11 }}
          MIXAMO_BUNDLE_12: ${{ secrets.MIXAMO_BUNDLE_12 }}
          MIXAMO_BUNDLE_13: ${{ secrets.MIXAMO_BUNDLE_13 }}
          MIXAMO_BUNDLE_14: ${{ secrets.MIXAMO_BUNDLE_14 }}
          MIXAMO_BUNDLE_15: ${{ secrets.MIXAMO_BUNDLE_15 }}
          MIXAMO_BUNDLE_16: ${{ secrets.MIXAMO_BUNDLE_16 }}
          MIXAMO_BUNDLE_17: ${{ secrets.MIXAMO_BUNDLE_17 }}
          MIXAMO_BUNDLE_18: ${{ secrets.MIXAMO_BUNDLE_18 }}
          MIXAMO_BUNDLE_19: ${{ secrets.MIXAMO_BUNDLE_19 }}
          MIXAMO_BUNDLE_20: ${{ secrets.MIXAMO_BUNDLE_20 }}
          MIXAMO_BUNDLE_21: ${{ secrets.MIXAMO_BUNDLE_21 }}
          MIXAMO_BUNDLE_22: ${{ secrets.MIXAMO_BUNDLE_22 }}
          MIXAMO_BUNDLE_23: ${{ secrets.MIXAMO_BUNDLE_23 }}
          MIXAMO_BUNDLE_24: ${{ secrets.MIXAMO_BUNDLE_24 }}
        run: node studio/restore-mixamo.mjs
      - name: Render clip
        id: render
        env:
          JOB_INPUT: ${{ inputs.job }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            JOBS="$JOB_INPUT"
          else
            BEFORE="$EVENT_BEFORE"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE=$(git rev-parse -q --verify HEAD~1 || git hash-object -t tree /dev/null)
            fi
            JOBS=$(git diff --name-only "$BEFORE" HEAD -- 'jobs/*/clip.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
          for J in $JOBS; do node studio/clip.mjs "$J"; done
      - name: Publish review clips
        if: steps.render.outputs.jobs != ''
        env:
          JOBS: ${{ steps.render.outputs.jobs }}
        run: |
          git config user.name "raymi-clip-bot"
          git config user.email "actions@users.noreply.github.com"
          for J in $JOBS; do git add "jobs/$J/boards/"*.mp4; done
          if ! git diff --cached --quiet; then
            git commit -m "VRM motion study for $JOBS [skip ci]"
            for t in 1 2 3 4; do
              if git fetch origin "$GITHUB_REF_NAME" -q && git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME"; then break; fi
              git rebase --abort 2>/dev/null || true
              if [ "$t" = 4 ]; then exit 1; fi
              sleep 10
            done
          fi
