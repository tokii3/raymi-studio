name: stills

# Single frames in the cloud (toki's PC never renders - not even one still): look development, idea boards,
# the component catalog. Start by pushing jobs/<job>/stills.json:
#   {"format": "mv" | "short", "frames": [12, 140], "names": ["A1", "A2"], "scale": 0.5,
#    "passes": [{"format": "mv", "frames": [..], "names": [..]}, {"format": "short", ...}]  (instead of one format),
#    "thumbs": true (thumbnail candidates: also boards/thumbs_168.jpg, every candidate at feed size - raymi/thumbs.py),
#    "to": "renders" (default: reports/<job>/stills/ on branch renders) | "boards" (commit into jobs/<job>/boards/ on main)
#          | "catalog" (commit into studio/catalog/ on main), "dest": "jobs/<song job>/boards" (with "to": "boards"),
#    "probe": N (the scene probe on one runner - for a whole film use qc.yml: probe + mask pass + eye level in parallel)}
# A job with shots.json is compiled first (python -m raymi timeline), so the stills show exactly the script.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "job folder under jobs/"
        required: true
  push:
    branches: [main]
    paths: ["jobs/*/stills.json"]

permissions:
  contents: write

concurrency:
  group: stills-${{ github.run_id }}   # one group per run: a pending run is never dropped by a newer push (2026-10-24: two POV finals lost)
  cancel-in-progress: false

jobs:
  stills:
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # a scene probe over a whole film (stills.json "probe") takes longer than a still board
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools
        run: |
          bash .github/ffmpeg.sh   # apt with a time limit, else a static build (never hangs the job)
          pip install -q -r requirements.txt
      - name: Node modules (cached)
        id: nm
        uses: actions/cache@v4
        with:
          path: studio/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('studio/package-lock.json') }}-v1
      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: cd studio && npm ci --no-audit --no-fund
      - name: Tests (python + studio typecheck + guards)
        run: |
          timeout 600 python -m pytest -q -v tests < /dev/null
          cd studio && npx tsc --noEmit && node --test test/check.test.mjs
      - name: Browser
        run: cd studio && npx remotion browser ensure
      - name: Which jobs
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOBS="${{ github.event.inputs.job }}"
          else
            BEFORE="${{ github.event.before }}"
            # a push of several commits: the base is outside the shallow checkout - fetch it (2026-10-24: stills ran nothing)
            [ -n "$BEFORE" ] && ! git cat-file -e "$BEFORE" 2>/dev/null && git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || true
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE=$(git rev-parse -q --verify HEAD~1 || git hash-object -t tree /dev/null)
            fi
            JOBS=$(git diff --name-only "$BEFORE" HEAD -- 'jobs/*/stills.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
      - name: Her font grows (missing glyphs built in her style, committed back)
        if: steps.which.outputs.jobs != ''
        run: |
          bash .github/font_grow.sh ${{ steps.which.outputs.jobs }}   # retries on a parallel run's font push
      - name: Private assets (licensed motions + VRM models - never in this public repo)
        if: steps.which.outputs.jobs != ''
        uses: actions/checkout@v4
        with:
          repository: tokii3/raymi-private-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: .private-assets
      - name: Stage private assets on the runner only
        if: steps.which.outputs.jobs != ''
        run: |
          mkdir -p studio/.motions assets/vrm
          cp .private-assets/motions/*.fbx studio/.motions/
          cp .private-assets/vrm/*.vrm assets/vrm/
      - name: Render stills
        if: steps.which.outputs.jobs != ''
        run: |
          set -e
          mkdir -p /tmp/stills; FITTED=""
          for J in ${{ steps.which.outputs.jobs }}; do
            S="jobs/$J/stills.json"
            get() { python -c "import json,sys;v=json.load(open(sys.argv[1])).get(sys.argv[2],sys.argv[3]);print(','.join(map(str,v)) if isinstance(v,list) else v)" "$S" "$1" "$2"; }
            SC=$(get scale 1); TO=$(get to renders)
            OUT="/tmp/stills/$J"
            [ "$TO" = "boards" ] && OUT="$PWD/jobs/$J/boards"
            [ "$TO" = "catalog" ] && OUT="$PWD/studio/catalog"
            DEST=$(get dest ""); [ -n "$DEST" ] && OUT="$PWD/$DEST"   # e.g. a board job writes into the song job's boards/
            python -m raymi stills-passes "$J" > "/tmp/stills/$J.passes"   # one pass per format (thumbs: mv + short)
            while IFS=$'\t' read -r FMT FR NAMES; do
              if [ -f "jobs/$J/shots.json" ] && grep -q '"voice"' "jobs/$J/shots.json"; then   # a talking Short: its sound exists before the timeline
                python -m raymi voice-lines "$J" < /dev/null && python -m raymi mix "$J" < /dev/null
              fi
              if [ -f "jobs/$J/shots.json" ]; then python -m raymi timeline "$J" "$FMT" < /dev/null; fi
              START=$(date +%s)
              PROBE=$(get probe 0)
              if [ "$PROBE" != "0" ]; then   # the scene probe over the whole film (toki 2026-10-24: fault classes, not spots)
                (cd studio && node probe.mjs "$J" --every "$PROBE" --out "../jobs/$J/out/probe_$FMT.json") < /dev/null
                { echo "#### probe $J $FMT"; echo '```'; python -m raymi probe "$J" "$FMT" < /dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                cp "jobs/$J/out/probe_$FMT.json" "jobs/$J/boards/probe_$FMT.json" 2>/dev/null || true   # kept on main: a refused still must not lose a 50-min measurement (stills run 40132877144)
              fi
              # frame fit (raymi/frame.py, Watch Me stills 1): close shots onto her MEASURED head, then the lyric fitter
              # and the guards again on the moved lenses - the stills below show the corrected film, shots.json is kept
              if [ "$(get frame_fit False)" = "True" ] && [ -f "jobs/$J/out/probe_$FMT.json" ]; then
                { echo "#### frame fit $J $FMT"; echo '```'; python -m raymi frame "$J" "$FMT" < /dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                python -m raymi timeline "$J" "$FMT" < /dev/null
                (cd studio && node guard.mjs "$J" --fill-all) < /dev/null >> "$GITHUB_STEP_SUMMARY" || true
                python -m raymi timeline "$J" "$FMT" < /dev/null
                { echo "#### guards $J $FMT"; (cd studio && node guard.mjs "$J") < /dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
                FITTED="$FITTED jobs/$J/shots.json"; echo "jobs/$J/shots.json" >> /tmp/stills/fitted   # published even if a still is refused
              fi
              [ -n "$FR" ] || continue
              (cd studio && node stills.mjs "$J" "$FR" --scale "$SC" --out "$OUT" ${NAMES:+--names "$NAMES"}) < /dev/null
              echo "$J ($FMT): $(echo $FR | tr ',' ' ' | wc -w) stills in $(( $(date +%s) - START )) s -> $TO" >> "$GITHUB_STEP_SUMMARY"
              if [ -f "jobs/$J/shots.json" ] && grep -q '"hero"' "jobs/$J/shots.json"; then   # main element readable at phone size?
                (cd studio && node guard.mjs "$J" --hero-boxes "$FR" > "../jobs/$J/out/hero_boxes.json") < /dev/null
                python -m raymi hero "$J" "$OUT" "$FR" "$NAMES" < /dev/null >> "$GITHUB_STEP_SUMMARY" || true
              fi
            done < "/tmp/stills/$J.passes"
            if [ "$(get thumbs False)" = "True" ]; then python -m raymi thumbs "$OUT"; fi   # boards/thumbs_168.jpg: the feed view
            { echo "#### exposure $J"; python -m raymi exposure "$OUT" || true; } >> "$GITHUB_STEP_SUMMARY"   # burnt / washed / loud / flat (toki 2026-10-24)
            echo "$TO" > "/tmp/stills/$J.to"

          done
      - name: Publish
        if: always() && steps.which.outputs.jobs != ''   # stills already made are kept even when a later job fails
        run: |
          git config user.name "raymi-stills-bot"
          git config user.email "actions@users.noreply.github.com"
          for P in jobs/*/boards studio/catalog; do [ -e "$P" ] && git add "$P"; done   # one missing path must not drop the others
          [ -f /tmp/stills/fitted ] && for P in $(cat /tmp/stills/fitted); do git add "$P"; done   # frame fit: the moved lenses
          # a parallel render may push (its font commit) between our pull and push: retry (FIRESTARTER thumbs lost twice)
          git diff --cached --quiet || { git commit -qm "stills for ${{ steps.which.outputs.jobs }} [skip ci]"; for t in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 10; done; }
          if ls /tmp/stills/*/ > /dev/null 2>&1; then
            git fetch -q origin renders || true
            if git rev-parse -q --verify origin/renders > /dev/null; then git worktree add -q -B renders /tmp/rb origin/renders;
            else git worktree add -q --orphan -b renders /tmp/rb; fi
            for D in /tmp/stills/*/; do J=$(basename "$D"); mkdir -p "/tmp/rb/reports/$J/stills"; cp "$D"*.jpg "/tmp/rb/reports/$J/stills/" 2>/dev/null || true; done
            cd /tmp/rb && git add reports && (git diff --cached --quiet || git commit -qm "stills run ${{ github.run_number }}") && { for t in 1 2 3 4 5; do git push -q origin renders && break; git pull --rebase -q origin renders; sleep 8; done; }
          fi
